run_id: default
bootstrap: "localhost:9092"
parquet_path: data/yellow_tripdata_2026-01.parquet
max_events: 30000          # size of the taxi segment to replay
key_mode: pickup_zone       # pickup_zone | none  (none = round-robin experiment K2)

topics:
  raw: taxi.raw
  clean: taxi.clean
  metrics: taxi.metrics
  lsh: taxi.lsh

partitions: 4
producer_rate: 400
duplicate_rate: 0.02
delayed_event_rate: 0.02
max_delay_seconds: 20
window_minutes: 60
hll_precision: 12
dgim_max_window: 10000
bloom_expected_items: 200000
bloom_false_positive_target: 0.01
lsh_num_hashes: 100
lsh_bands: 20
lsh_rows_per_band: 5
jaccard_threshold: 0.50
stage1_max_offsets_per_trigger: 20000   # max events Spark pulls per micro-batch
bloom_bits: null                        # set e.g. 200000 later to force Bloom false positives
stage2_max_offsets_per_trigger: 20000
report_interval_seconds: 5
reservoir_sizes: [100, 1000, 10000]
dgim_queries: [1000, 5000, 10000]
diverse_min_destinations: 10
entity_sample_fraction: 0.2      # fraction of pickup zones kept by hash (entity sampling)
event_sample_cap: 5000           # max events held for event sampling per window
allowed_lateness_minutes: 30     # event-time lateness policy
lsh_min_trips: 20
lsh_extra_configs: [[25, 4], [10, 10]]   # extra band x rows settings (each must multiply to lsh_num_hashes)
stage3_max_offsets_per_trigger: 20000
spark_driver_memory: 1g     # per Spark app; 3 apps run together
dgim_r: 8
